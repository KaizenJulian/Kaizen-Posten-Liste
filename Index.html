<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAIZEN POSTENLISTE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f171b;
    --panel: #162228;
    --line: #28383f;
    --text: #e8e3d4;
    --muted: #8b9a9c;
    --gold: #d6a847;
    --jade: #5fb89a;
    --lock: #6c7479;
    --special: #7f9bd6;
  }

  * { box-sizing: border-box; }

  html { color-scheme: dark; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", "Segoe UI", system-ui, sans-serif;
    line-height: 1.5;
  }

  .page {
    max-width: 960px;
    margin: 0 auto;
    padding: 56px 20px 80px;
  }

  header { margin-bottom: 40px; }

  h1 {
    margin: 0;
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
    font-weight: 800;
    font-size: clamp(2.2rem, 7vw, 4rem);
    letter-spacing: 0.04em;
    line-height: 1.05;
    color: var(--gold);
  }

  .sub {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 0.98rem;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: center;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 0.95rem;
  }

  .toolbar label {
    display: inline-flex;
    gap: 8px;
    align-items: center;
    cursor: pointer;
  }

  .toolbar input[type="checkbox"] { accent-color: var(--jade); width: 16px; height: 16px; }

  .toolbar input[type="search"] {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font: inherit;
    min-width: 220px;
  }

  .toolbar input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }


  .nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .nav button {
    padding: 9px 20px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  .nav button:hover { border-color: var(--gold); }
  .nav button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .nav button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #1a1405; font-weight: 700; }

  section { margin-bottom: 44px; }

  .section-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px 16px;
    margin-bottom: 10px;
  }

  h2 {
    margin: 0;
    font-family: "Shippori Mincho", Georgia, serif;
    font-weight: 600;
    font-size: 1.5rem;
    letter-spacing: 0.02em;
  }

  .stand { color: var(--muted); font-size: 0.9rem; }

  .table-wrap {
    overflow-x: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  table { width: 100%; border-collapse: collapse; min-width: 560px; }

  th, td { padding: 11px 16px; text-align: left; vertical-align: middle; }

  th {
    font-weight: 500;
    font-size: 0.88rem;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.02);
  }

  td { border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }

  td.posten { font-weight: 700; width: 32%; }
  td.status { width: 130px; }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.85rem;
    border: 1px solid currentColor;
    white-space: nowrap;
  }

  .badge.besetzt { color: var(--jade); }
  .badge.frei { color: var(--gold); }
  .badge.gesperrt { color: var(--lock); }
  .badge.spielen { color: var(--special); }

  td.empty { color: var(--muted); }
  tr.locked td:not(.status) { color: var(--lock); }

  .none {
    display: none;
    padding: 18px 16px;
    color: var(--muted);
  }

  footer { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }

  @media (max-width: 560px) {
    .page { padding-top: 36px; }
    th, td { padding: 10px 12px; }
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>KAIZEN POSTENLISTE</h1>
    <p class="sub" id="sub"></p>
    <nav class="nav" aria-label="Dörfer">
      <button type="button" data-dorf="Konohagakure" aria-pressed="true">Konohagakure</button>
      <button type="button" data-dorf="Sunagakure" aria-pressed="false">Sunagakure</button>
    </nav>
    <div class="toolbar">
      <input type="search" id="suche" placeholder="Name oder Posten suchen" aria-label="Suchen">
      <label><input type="checkbox" id="nurFrei"> Nur freie Posten zeigen</label>
    </div>
  </header>

  <div id="liste"></div>
  <p class="none" id="keine">Keine Treffer. Ändere die Suche oder den Filter.</p>

  <footer>Letzte Aktualisierung: <span id="stand"></span></footer>
</main>

<script>
/* =====================================================
   HIER TRÄGST DU ALLES EIN
   -----------------------------------------------------
   - Jedes Dorf hat ein "stand"-Datum und eine Liste "gruppen"
   - Jede Gruppe hat einen "titel" und eine Liste "posten"
   - Jede Zeile: [ "Posten", "OOC-Name", "IC-Name" ]
   - Leer lassen ("") = Posten ist frei
   - "LOCKED" in den OOC-Namen schreiben = Posten gesperrt
   - "Nur durch Spielen erreichbar" oder "Durch Bewerbung bewerbar"
     wird automatisch als eigener Status angezeigt
   - Neue Gruppe: Block { titel: "...", posten: [ ... ] } kopieren
   ===================================================== */


const DOERFER = {

    gruppen: [

          ["Elite - Jonin", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"],
          ["Elite - Jonin", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"],
          ["Jonin Polizeileitung", "", ""],

          ["Jonin Krankenhausleitung", "", ""],
          ["Jonin", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"],

          ["Jonin", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"],
          ["Jonin", "LOCKED", ""],
          ["Jonin", "LOCKED", ""],
          ["Jonin", "LOCKED", ""],
          ["Spezial - Jonin", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"],
          ["Spezial - Jonin", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"],
          ["Spezial - Jonin", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"],
          ["Spezial - Jonin", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"],
          ["Lehrer (Chunin)", "Durch Bewerbung bewerbar", "Durch Bewerbung bewerbar"],
          ["Lehrer (Chunin)", "Durch Bewerbung bewerbar", "Durch Bewerbung bewerbar"]
        ]
      },
      {
        titel: "Anbu",
        posten: [
          ["Anbu - Leitung", "", ""],
          ["Anbu - Mitglied", "", ""],
          ["Anbu - Mitglied", "", ""],
          ["Anbu - Mitglied", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"],
          ["Anbu - Mitglied", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"],
          ["Anbu - Mitglied", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"]
        ]
      },
      {
        titel: "Uchiha - Clan",
        posten: [
          ["Uchiha - Leitung", "", ""],
          ["Uchiha - Mitglied", "", ""],
          ["Uchiha - Mitglied", "", ""],
          ["Uchiha - Mitglied", "LOCKED", ""],
          ["Uchiha - Mitglied", "LOCKED", ""],
          ["HIGHTEAM", "", ""]
        ]
      },
      {
        titel: "Hyuuga - Clan",
        posten: [
          ["Hyuuga - Leitung", "", ""],
          ["Hyuuga - Mitglied", "", ""],
          ["Hyuuga - Mitglied", "", ""],
          ["Hyuuga - Mitglied", "LOCKED", ""],
          ["Hyuuga - Mitglied", "LOCKED", ""],
          ["HIGHTEAM", "", ""]
        ]
      },
      {
        titel: "Senju - Clan",
        posten: [
          ["Senju - Leitung", "", ""],
          ["Senju - Mitglied", "", ""],
          ["Senju - Mitglied", "", ""],
          ["Senju - Mitglied", "LOCKED", ""],
          ["Senju - Mitglied", "LOCKED", ""],
          ["HIGHTEAM", "", ""]
        ]
      },
      {

        posten: [
          ["Nara - Leitung", "", ""],
          ["Nara - Mitglied", "", ""],

          ["Nara - Mitglied", "LOCKED", ""],
          ["Nara - Mitglied", "LOCKED", ""],
          ["HIGHTEAM", "", ""]
        ]
      }
    ]
  },

    gruppen: [
      {

        posten: [
          ["Kazekage", "", ""],

          ["Jonin", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"],

          ["Spezial - Jonin", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"],
          ["Spezial - Jonin", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"],
          ["Spezial - Jonin", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"],
          ["Lehrer (Chunin)", "Durch Bewerbung bewerbar", "Durch Bewerbung bewerbar"],

        ]
      },
      {

        posten: [
          ["Anbu - Leitung", "", ""],

          ["Anbu - Mitglied", "", ""],
          ["Anbu - Mitglied", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"],
          ["Anbu - Mitglied", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"],
          ["Anbu - Mitglied", "Nur durch Spielen erreichbar", "Nur durch Spielen erreichbar"]
        ]
      },
      {

        posten: [

        ]

      {

        posten: [
          ["Kyoufuu - Leitung", "", ""],

          ["Kyoufuu - Mitglied", "LOCKED", ""],
          ["Kyoufuu - Mitglied", "LOCKED", ""],
          ["HIGHTEAM", "", ""]
        ]
      },
      {
        titel: "Ayatsuri - Clan",
        posten: [
          ["Ayatsuri - Leitung", "", ""],
          ["Ayatsuri - Mitglied", "", ""],
          ["Ayatsuri - Mitglied", "Durch Bewerbung bewerbar", "Durch Bewerbung bewerbar"],
          ["Ayatsuri - Mitglied", "LOCKED", ""],
          ["Ayatsuri - Mitglied", "LOCKED", ""],
          ["HIGHTEAM", "", ""]
        ]
      }
    ]
  }
};

let aktuell = "Konohagakure";

/* =====================================================
   AB HIER MUSS NICHTS GEÄNDERT WERDEN
   ===================================================== */

function status(ooc) {
  const t = (ooc || "").trim();
  if (!t) return { key: "frei", text: "Frei" };
  if (/locked/i.test(t)) return { key: "gesperrt", text: "Gesperrt" };
  if (/nur durch spielen|durch bewerbung/i.test(t)) return { key: "spielen", text: /bewerbung/i.test(t) ? "Bewerbung" : "Im Spiel" };
  return { key: "besetzt", text: "Besetzt" };
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function cell(value, special) {
  const t = (value || "").trim();
  if (!t || /locked/i.test(t)) return '<td class="empty">–</td>';
  return "<td>" + esc(t) + "</td>";
}

function render() {
  const q = document.getElementById("suche").value.trim().toLowerCase();
  const nurFrei = document.getElementById("nurFrei").checked;
  const out = [];

  DOERFER[aktuell].gruppen.forEach(g => {
    const zeilen = g.posten.filter(([p, ooc, ic]) => {
      const s = status(ooc);
      if (nurFrei && s.key !== "frei") return false;
      if (q && !(p + " " + ooc + " " + ic).toLowerCase().includes(q)) return false;
      return true;
    });
    if (!zeilen.length) return;

    const rows = zeilen.map(([p, ooc, ic]) => {
      const s = status(ooc);
      return '<tr class="' + (s.key === "gesperrt" ? "locked" : "") + '">' +
        '<td class="posten">' + esc(p) + "</td>" +
        cell(ooc) + cell(ic) +
        '<td class="status"><span class="badge ' + s.key + '">' + s.text + "</span></td></tr>";
    }).join("");

    const frei = g.posten.filter(r => status(r[1]).key === "frei").length;

    out.push(
      "<section><div class=\"section-head\"><h2>" + esc(g.titel) + "</h2>" +
      '<span class="stand">' + frei + " von " + g.posten.length + " Posten frei</span></div>" +
      '<div class="table-wrap"><table><thead><tr>' +
      "<th>Posten</th><th>OOC-Name</th><th>IC-Name</th><th>Besetzt?</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div></section>"
    );
  });

  const stand = DOERFER[aktuell].stand;
  document.getElementById("stand").textContent = stand;
  document.getElementById("sub").textContent = aktuell + " · Stand " + stand;
  document.querySelectorAll(".nav button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.dorf === aktuell ? "true" : "false"));
  document.getElementById("liste").innerHTML = out.join("");
  document.getElementById("keine").style.display = out.length ? "none" : "block";
}

document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => {
  aktuell = b.dataset.dorf;
  try { history.replaceState(null, "", "#" + aktuell.toLowerCase()); } catch (e) { /* in der Vorschau nicht erlaubt, auf deiner Seite funktioniert es */ }
  render();
}));
if (location.hash === "#sunagakure") aktuell = "Sunagakure";
document.getElementById("suche").addEventListener("input", render);
document.getElementById("nurFrei").addEventListener("change", render);
render();
</script>
</body>
</html>
